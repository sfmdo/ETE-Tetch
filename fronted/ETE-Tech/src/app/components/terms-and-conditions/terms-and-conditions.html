<div *ngIf="isOpen" class="fixed inset-0 z-[60] flex items-center justify-center bg-inverse-surface/40 backdrop-blur-sm p-4 animate-in fade-in duration-300">
  
  <div class="relative w-full max-w-2xl max-h-[90vh] bg-surface-container-lowest rounded-xl shadow-2xl flex flex-col overflow-hidden zoom-in duration-300">
    
    <div class="px-8 py-6 border-b border-outline-variant/15 flex justify-between items-center bg-surface-container-low/50">
      <div>
        <h1 class="text-2xl font-headline font-extrabold tracking-tighter text-primary">Terminos y Condiciones</h1>
        <p class="text-xs font-body text-on-surface-variant tracking-wider uppercase mt-1">Fecha efectiva: Abril 2025</p>
      </div>
      <button (click)="closeModal()" class="p-2 hover:bg-surface-container-high rounded-full transition-colors text-on-surface-variant">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <div class="flex-1 overflow-y-auto px-8 py-8 custom-scrollbar">
  
  <div [innerHTML]="termsAndConditions"></div>

  <div class="relative h-32 rounded-lg overflow-hidden flex items-center justify-center mt-8">
    </div>
</div>

    <div class="px-8 py-6 bg-surface-container border-t border-outline-variant/15 flex justify-end gap-3">
      <button (click)="closeModal()" class="px-8 py-2.5 bg-primary text-on-primary font-bold rounded shadow-lg hover:opacity-90 transition-all active:scale-95">
        Cerrar
      </button>
    </div>
  </div>
</div>
